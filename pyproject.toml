[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-scan"
version = "0.1.30"
description = "KiWi SDR scanning/monitoring utilities"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ShackMate" }]

dependencies = [
	"fastapi>=0.95",
	"uvicorn[standard]>=0.20",
	"numpy>=1.24",
	"faster-whisper>=1.1,<2",
	"reverse_geocoder>=1.5.1",
	"pycountry>=24.6.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
kiwi-scan = "kiwi_scan.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
