# lighttpd config for adsb-1090 container
# Serves SkyAware UI and dump1090-fa JSON on port 8080.
#
# URL layout (matches the native dump1090-fa / lighttpd install on sigmon-2):
#   /skyaware/          → SkyAware web UI
#   /skyaware/data/     → dump1090-fa JSON output  (used by NOC dashboard)
#   /data/              → dump1090-fa JSON output  (used by SkyAware's own JS)

server.port          = 8080
server.tag           = "dump1090-fa"
server.document-root = "/opt/adsb/html"
server.modules       = ("mod_alias", "mod_redirect", "mod_indexfile")
index-file.names     = ("index.html")
server.errorlog      = "/dev/stderr"

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".js"   => "application/javascript",
    ".css"  => "text/css",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".ico"  => "image/x-icon",
    ".svg"  => "image/svg+xml",
    ".gz"   => "application/x-gzip",
    ""      => "application/octet-stream",
)

alias.url = (
    "/skyaware/data/" => "/run/dump1090/",
    "/data/"          => "/run/dump1090/",
    "/skyaware/"      => "/opt/adsb/html/",
)

url.redirect = ( "^/$" => "/skyaware/" )
