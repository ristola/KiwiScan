# Deploy on sigmon-2 (10.13.73.195)
#
# Setup steps on sigmon-2:
#   1. Enable Docker TCP API — add to /etc/docker/daemon.json:
#        { "hosts": ["unix:///var/run/docker.sock", "tcp://10.13.73.195:2375"] }
#      Then: sudo systemctl restart docker
#
#   2. Build both images on sigmon-2:
#        docker build -t n4ldr/noaa-weather-radio:latest .
#        docker build -t n4ldr/noaa-eas-api:latest ./api
#
#   3. Start:
#        docker compose up -d
#
# Consumers reach the EAS API at http://10.13.73.195:4027
#   GET  /alerts          — recent EAS alerts (JSON)
#   GET  /status          — uptime, client count
#   WS   /ws/alerts       — real-time push per alert
#   GET  /alerts/{id}/audio — WAV playback

services:
  noaa-weather-radio:
    image: n4ldr/noaa-weather-radio:latest
    container_name: kiwiscan-noaa-wr
    restart: unless-stopped
    network_mode: host
    environment:
      RTL_TCP_HOST: "127.0.0.1"
      RTL_TCP_PORT: "7373"
      RTL_GAIN: "38"
      RTL_PPM: "0"
      EAS_ENABLED: "1"
      RECORD_ALERTS: "1"
      EAS_OUTPUT_DIR: "/opt/noaa_wr/eas_messages"
      CH_1_ENABLED: "1"
      CH_1_NAME: "WX2"
      CH_2_ENABLED: "1"
      CH_2_NAME: "WX4"
      CH_3_ENABLED: "1"
      CH_3_NAME: "WX5"
      CH_4_ENABLED: "1"
      CH_4_NAME: "WX3"
      CH_5_ENABLED: "1"
      CH_5_NAME: "WX6"
      CH_6_ENABLED: "1"
      CH_6_NAME: "WX7"
      CH_7_ENABLED: "1"
      CH_7_NAME: "WX1"
    volumes:
      - noaa-alerts:/opt/noaa_wr/eas_messages

  noaa-eas-api:
    image: n4ldr/noaa-eas-api:latest
    container_name: kiwiscan-noaa-api
    restart: unless-stopped
    ports:
      - "4027:4027"
    environment:
      EAS_DIR: "/data"
      MAX_ALERTS: "200"
      POLL_SEC: "3"
    volumes:
      - noaa-alerts:/data:ro

volumes:
  noaa-alerts:
    name: kiwiscan-noaa-alerts
